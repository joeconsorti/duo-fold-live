name: Android signed release

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'tools/play-private/**'
      - 'tools/archive_play_assets.py'
      - '.github/workflows/archive-play.yml'
  workflow_dispatch:

concurrency:
  group: github-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/wrapper/gradle-wrapper.properties
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Assign increasing CI version code
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          if not re.search(r'versionName\s*=\s*"(?:[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+|3\.5\.[0123456])"', p.read_text()):
              raise SystemExit('Release policy: only alpha versions and owner-approved 3.5.0/3.5.1/3.5.2/3.5.3/3.5.4/3.5.5/3.5.6 are allowed')
          current = int(re.search(r'\bversionCode\s*=\s*(\d+)', p.read_text()).group(1))
          code = max(current, 1000 + int(os.environ['GITHUB_RUN_NUMBER']))
          text, count = re.subn(r'\bversionCode\s*=\s*\d+', f'versionCode = {code}', p.read_text())
          if count != 1:
              raise SystemExit('Expected exactly one numeric versionCode in app/build.gradle.kts')
          p.write_text(text)
          PY

      - name: Mark alpha 24 BROKEN without removing downloads
        if: github.ref_name == 'alpha/3.0.4-alpha.25'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit ci-39-1 --repo "$GITHUB_REPOSITORY" --title "BROKEN — Duo Fold Live 3.0.4-alpha.24" --prerelease --latest=false --notes-file docs/3.0.4-alpha.24-CHANGELOG.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/ci-39-1" --jq '.assets[] | [.id, .name] | @tsv' > "$RUNNER_TEMP/broken-assets.tsv"
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -f "label=BROKEN — $asset_name" > /dev/null
          done < "$RUNNER_TEMP/broken-assets.tsv"

      - name: Test and build unsigned release
        run: |
          python3 tools/check_inner_stretch.py
          python3 tools/check_window_shading.py
          python3 tools/check_motion_projection.py
          ./gradlew --no-daemon testGithubReleaseUnitTest lintGithubRelease assembleGithubRelease

      - name: Audit release manifests and test counts
        run: python3 tools/check_release_outputs.py --variant github

      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          umask 077
          key="$RUNNER_TEMP/duofold-live.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          mkdir -p dist
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk="dist/Duo-Fold-Live-github-ci-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          "$tools/zipalign" -f -P 16 4 app/build/outputs/apk/github/release/app-github-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ci-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          printf 'Automated build of %s at %s.\nVersion code: %s\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)" > "$RUNNER_TEMP/release-notes.txt"
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ -f "docs/$version-CHANGELOG.md" ]; then
            cat "docs/$version-CHANGELOG.md" >> "$RUNNER_TEMP/release-notes.txt"
          fi
          release_flags=(--prerelease --latest=false)
          # Owner approved alpha.7 plus the three default changes as 3.5.2.
          if [ "$GITHUB_REF_NAME" = main ] && [ "$version" = 3.5.2 ]; then
            release_flags=(--latest)
          fi
          # Owner approved the alpha.41 feature set plus copy edits as stable 3.5.3.
          if [ "$GITHUB_REF_NAME" = release/3.5.3 ] && [ "$version" = 3.5.3 ]; then
            tag="v3.5.3"
            release_flags=(--latest)
          fi
          # Owner approved alpha.7 closure behavior and Smooth/Fast presets as stable 3.5.4.
          if [ "$version" = 3.5.4 ] && { [ "$GITHUB_REF_NAME" = release/3.5.4 ] || [ "$GITHUB_REF_NAME" = main ]; }; then
            tag="v3.5.4"
            release_flags=(--latest)
          fi
          # Owner approved the section-order-only update as stable 3.5.6.
          if [ "$GITHUB_REF_NAME" = main ] && [ "$version" = 3.5.6 ]; then
            tag="v3.5.6"
            release_flags=(--latest)
          fi
          gh release create "$tag" dist/Duo-Fold-Live-github-*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Duo Fold Live $version" "${release_flags[@]}" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"

      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/duofold-live.jks" "$RUNNER_TEMP/aligned.apk"
