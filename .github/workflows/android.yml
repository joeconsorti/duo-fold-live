name: DuofoldX Android verification

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duofoldx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Verify inherited source and privacy baseline
        run: |
          cmp PRIVACY.md app/src/main/assets/privacy.txt
          python3 tools/check_inner_stretch.py
          python3 tools/check_window_shading.py
          python3 tools/check_motion_projection.py
          python3 tools/check_b8_baseline.py
          python3 tools/check_live_b8.py

      - name: Run unit tests, lint and debug APK build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testGithubDebugUnitTest lintGithubDebug assembleGithubDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DuofoldX-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14

# This workflow is intentionally test-only.
# It has read-only repository permissions and cannot sign, upload or publish releases.
